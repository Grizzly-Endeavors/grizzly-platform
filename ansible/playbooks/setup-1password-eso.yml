---
# Materialise the 1Password service account token that External Secrets
# Operator authenticates with.
#
# This is the one credential in the cluster that cannot itself come from an
# ExternalSecret — it is what makes ExternalSecrets work. Ansible writes it
# directly from the encrypted vault, so a fresh cluster can be bootstrapped
# from a checkout plus .vault_pass.
#
# The ClusterSecretStore that consumes it is reconciled by Flux from
# kubernetes/infrastructure/external-secrets-stores/onepassword-store.yaml.
#
# Rotating the token: mint a new service account in 1Password, update
# vault_op_eso_service_account_token in the encrypted vault, re-run this play.
# ESO picks up the new value on its next reconcile.
#
# Usage:
#   ansible-playbook -i ansible/inventory \
#     ansible/playbooks/setup-1password-eso.yml --vault-password-file .vault_pass

- name: Provision the 1Password token for External Secrets Operator
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"

  vars_files:
    - "{{ playbook_dir }}/../../ansible/inventory/group_vars/all/vault.yml"
    - "{{ playbook_dir }}/../../ansible/inventory/group_vars/all/vars.yml"

  tasks:
    - name: Verify the service account token is present in the vault
      ansible.builtin.assert:
        that:
          - vault_op_eso_service_account_token is defined
          - vault_op_eso_service_account_token | length > 0
          - vault_op_eso_service_account_token.startswith('ops_')
        fail_msg: >-
          vault_op_eso_service_account_token is missing or malformed. 1Password
          service account tokens start with 'ops_'. Add it to
          ansible/inventory/group_vars/all/vault.yml.

    - name: Ensure the external-secrets namespace exists
      ansible.builtin.command: >-
        kubectl create namespace {{ eso_namespace | default('external-secrets') }}
        --dry-run=client -o yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ns_manifest
      changed_when: false

    - name: Apply the external-secrets namespace
      ansible.builtin.shell: kubectl apply -f -
      args:
        stdin: "{{ ns_manifest.stdout }}"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout"

    # The token goes via a 0600 temp file rather than --from-literal so it
    # never appears in the process list.
    - name: Create a temp dir for the token
      ansible.builtin.tempfile:
        state: directory
        suffix: op-eso-token
      register: token_tmpdir

    - name: Write the service account token to the temp file
      ansible.builtin.copy:
        content: "{{ vault_op_eso_service_account_token }}"
        dest: "{{ token_tmpdir.path }}/token"
        mode: "0600"
      no_log: true

    - name: Create or update the 1Password token Secret
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create secret generic onepassword-token \
          --from-file=token="{{ token_tmpdir.path }}/token" \
          -n {{ eso_namespace | default('external-secrets') }} \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Remove the temp dir
      ansible.builtin.file:
        path: "{{ token_tmpdir.path }}"
        state: absent
      when: token_tmpdir.path is defined

    - name: Confirm the Secret carries a token key
      ansible.builtin.command: >-
        kubectl get secret onepassword-token
        -n {{ eso_namespace | default('external-secrets') }}
        -o jsonpath={.data.token}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: token_check
      changed_when: false
      failed_when: token_check.stdout | length == 0
