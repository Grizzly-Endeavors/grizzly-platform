---
# R730xd Storage Preparation
# Mounts drives at bay-based paths using resolved_drives fact from playbook pre-tasks
# Partitions, formats, and mounts each drive at /mnt/data/bay<N>

- name: Validate resolved_drives fact exists
  ansible.builtin.assert:
    that:
      - resolved_drives is defined
      - resolved_drives | length > 0
      - resolved_drives | selectattr('by_id', 'defined') | list | length == resolved_drives | length
    fail_msg: >
      resolved_drives fact is not set, or entries are missing the by_id key. This
      role must be called from r730xd-storage.yml, which resolves drive bays via
      iDRAC and maps each to a stable /dev/disk/by-id path in pre_tasks.

- name: Install parted (required for partitioning)
  ansible.builtin.apt:
    name: parted
    state: present

- name: Display resolved drives
  ansible.builtin.debug:
    msg: "Bay {{ item.bay }} ({{ item.role }}): {{ item.by_id }} (currently /dev/{{ item.device }}) — serial {{ item.serial }}"
  loop: "{{ resolved_drives }}"
  loop_control:
    label: "bay{{ item.bay }}"

- name: Check for RAID or foreign filesystem signatures
  ansible.builtin.command: "blkid -o value -s TYPE {{ item.by_id }}"
  register: drive_signature_check
  changed_when: false
  failed_when: false
  loop: "{{ resolved_drives }}"
  loop_control:
    label: "bay{{ item.bay }}"

- name: Fail if drives have RAID or foreign signatures
  ansible.builtin.fail:
    msg: >
      Bay {{ item.item.bay }} ({{ item.item.by_id }}) has signature type '{{ item.stdout | trim }}'.
      Drives must be wiped before storage-prep can run.
      Run: ./scripts/wipe-r730xd-bays.sh {{ resolved_drives | map(attribute='bay') | join(' ') }}
  when:
    - item.stdout | trim | length > 0
    - item.stdout | trim != 'ext4'
  loop: "{{ drive_signature_check.results }}"
  loop_control:
    label: "bay{{ item.item.bay }}"

- name: Create GPT partition table on each drive
  community.general.parted:
    device: "{{ item.by_id }}"
    label: gpt
    state: info
  register: disk_info
  loop: "{{ resolved_drives }}"
  loop_control:
    label: "bay{{ item.bay }} ({{ item.by_id }})"

# Re-check the by-id link resolves to the same serial it did at resolution time,
# immediately before the one command in this role that can destroy data on a
# mis-identified disk. Closes the TOCTOU window between resolving resolved_drives
# and this task.
- name: Re-verify drive identity immediately before partitioning
  ansible.builtin.command: "lsblk -no SERIAL --nodeps {{ resolved_drives[idx].by_id }}"
  register: pre_partition_identity
  changed_when: false
  when: item.partitions | length == 0
  loop: "{{ disk_info.results }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Fail if a drive no longer matches its resolved identity
  ansible.builtin.fail:
    msg: >
      Bay {{ resolved_drives[idx].bay }} ({{ resolved_drives[idx].by_id }}) now
      reports serial '{{ item.stdout | trim }}', expected
      '{{ resolved_drives[idx].serial }}'. The device behind this by-id path
      changed since it was resolved — refusing to partition.
  when:
    - not (item.skipped | default(false))
    - (item.stdout | trim | replace(' ', '') | replace('-', '') | upper)
      != (resolved_drives[idx].serial | replace(' ', '') | replace('-', '') | upper)
  loop: "{{ pre_partition_identity.results }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Create single partition on drives without partitions
  community.general.parted:
    device: "{{ resolved_drives[idx].by_id }}"
    number: 1
    label: gpt
    part_start: "0%"
    part_end: "100%"
    state: present
  when: item.partitions | length == 0
  loop: "{{ disk_info.results }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

# by-id partition symlinks use a uniform -partN suffix regardless of the
# underlying bus (see docs/runbooks/zfs-pool-maintenance.md), which sidesteps
# the sdX1 vs nvme0n1p1 kernel-naming split entirely.
- name: Build partition device list
  ansible.builtin.set_fact:
    drive_partitions: >-
      {{
        resolved_drives | map(attribute='by_id')
        | map('regex_replace', '$', '-part1')
        | list
      }}

- name: Re-verify partition link exists immediately before formatting
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  register: pre_format_stat
  loop: "{{ drive_partitions }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Fail if the expected partition link is missing before formatting
  ansible.builtin.fail:
    msg: >
      Bay {{ resolved_drives[idx].bay }}: expected partition path {{ item }}
      does not exist. Refusing to format.
  when: not pre_format_stat.results[idx].stat.exists
  loop: "{{ drive_partitions }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Re-verify parent disk identity immediately before formatting
  ansible.builtin.command: "lsblk -no SERIAL --nodeps {{ resolved_drives[idx].by_id }}"
  register: pre_format_identity
  changed_when: false
  loop: "{{ drive_partitions }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Fail if a drive no longer matches its resolved identity before formatting
  ansible.builtin.fail:
    msg: >
      Bay {{ resolved_drives[idx].bay }} ({{ resolved_drives[idx].by_id }}) now
      reports serial '{{ pre_format_identity.results[idx].stdout | trim }}',
      expected '{{ resolved_drives[idx].serial }}'. The device behind this
      by-id path changed since it was resolved — refusing to format.
  when: >-
    (pre_format_identity.results[idx].stdout | trim | replace(' ', '') | replace('-', '') | upper)
    != (resolved_drives[idx].serial | replace(' ', '') | replace('-', '') | upper)
  loop: "{{ drive_partitions }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Create ext4 filesystem on each partition (skips existing)
  community.general.filesystem:
    fstype: "{{ storage_filesystem }}"
    dev: "{{ item }}"
    opts: "{{ storage_mkfs_options }}"
  loop: "{{ drive_partitions }}"
  loop_control:
    label: "bay{{ resolved_drives[idx].bay }}"
    index_var: idx

- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ storage_mount_base }}/bay{{ resolved_drives[idx].bay }}"
    state: directory
    mode: "0755"
  loop: "{{ drive_partitions }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }}"

- name: Get partition UUIDs
  ansible.builtin.command: "blkid -s UUID -o value {{ item }}"
  register: partition_uuids
  changed_when: false
  loop: "{{ drive_partitions }}"
  loop_control:
    label: "{{ item }}"

- name: Mount partitions and add to fstab
  ansible.posix.mount:
    path: "{{ storage_mount_base }}/bay{{ resolved_drives[idx].bay }}"
    src: "UUID={{ item.stdout }}"
    fstype: "{{ storage_filesystem }}"
    opts: "{{ storage_mount_options }}"
    state: mounted
  loop: "{{ partition_uuids.results }}"
  loop_control:
    index_var: idx
    label: "bay{{ resolved_drives[idx].bay }} (UUID={{ item.stdout }})"

- name: Build list of active mount points
  ansible.builtin.set_fact:
    active_mount_points: >-
      {{
        resolved_drives | map(attribute='bay')
        | map('regex_replace', '^(.*)$', storage_mount_base ~ '/bay\1')
        | list
      }}

- name: Find all existing bay mount point directories
  ansible.builtin.find:
    paths: "{{ storage_mount_base }}"
    file_type: directory
    patterns: "bay*"
  register: existing_mount_dirs

- name: Identify stale mount points (no longer backed by a drive)
  ansible.builtin.set_fact:
    stale_mount_points: >-
      {{
        existing_mount_dirs.files | map(attribute='path')
        | reject('in', active_mount_points)
        | list
      }}

- name: Remove stale fstab entries and unmount missing drives
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent
  loop: "{{ stale_mount_points }}"
  loop_control:
    label: "{{ item }}"

- name: Remove stale mount point directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ stale_mount_points }}"
  loop_control:
    label: "{{ item }}"

- name: Build data_drive_mounts fact for downstream roles
  ansible.builtin.set_fact:
    data_drive_mounts: "{{ _mounts }}"
  vars:
    _mounts: >-
      {%- set result = [] -%}
      {%- for drive in resolved_drives -%}
        {%- set _ = result.append({
          'bay': drive.bay,
          'role': drive.role,
          'serial': drive.serial,
          'device': drive.device,
          'path': storage_mount_base ~ '/bay' ~ drive.bay | string
        }) -%}
      {%- endfor -%}
      {{ result }}

- name: Display final storage layout
  ansible.builtin.command: lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT
  register: final_lsblk
  changed_when: false

- name: Show storage layout
  ansible.builtin.debug:
    msg: "{{ final_lsblk.stdout_lines }}"

- name: Display storage summary
  ansible.builtin.debug:
    msg:
      - "=== R730xd Storage Preparation Complete ==="
      - ""
      - "Drives: {{ resolved_drives | length }}"
      - "  Parity: {{ resolved_drives | selectattr('role', 'equalto', 'parity') | list | length }}"
      - "  Data: {{ resolved_drives | selectattr('role', 'equalto', 'data') | list | length }}"
      - "Filesystem: {{ storage_filesystem }}"
      - "Mount base: {{ storage_mount_base }}"
      - "Mount paths: {{ data_drive_mounts | map(attribute='path') | list | join(', ') }}"
