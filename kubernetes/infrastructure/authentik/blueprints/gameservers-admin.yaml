version: 1
metadata:
  name: gameservers-admin
entries:
  # Forward-auth (single application) proxy provider fronting the grizzly-
  # gameservers super-admin panel at gameservers-admin.grizzly-endeavors.com
  # (gameservers ADR-026). Fourth proxy provider in the homelab, after
  # grizzly-invite-admin, grizzly-webmail, and metabase.
  - model: authentik_providers_proxy.proxyprovider
    id: gameservers-admin-provider
    identifiers:
      name: gameservers-admin
    attrs:
      mode: forward_single
      external_host: https://gameservers-admin.grizzly-endeavors.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: gameservers-admin-app
    identifiers:
      slug: gameservers-admin
    attrs:
      name: Game Servers Admin
      provider: !KeyOf gameservers-admin-provider
      meta_launch_url: https://gameservers-admin.grizzly-endeavors.com
      meta_description: "Runtime settings, guild admission, and server controls for the Discord game-server bot (grizzly-admins only)"
      policy_engine_mode: any

  # Same rule as metabase and grizzly-invite's provisioning UI: scope both
  # app-library visibility and access to grizzly-admins (ADR-049).
  #
  # Unlike metabase, this is *not* the only gate — the panel re-checks
  # X-authentik-groups in-process, so a non-member who somehow passed this
  # binding still gets a refusal, and one that names the group they're missing
  # rather than the outpost's generic 403. The two layers are deliberate: this
  # one keeps the panel out of the app library and off the public internet, and
  # the in-app check is what makes a denial legible.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gameservers-admin-app
      group: !Find [authentik_core.group, [name, grizzly-admins]]
      order: 0
    attrs:
      enabled: true
      negate: false

  # NOTE: the embedded-outpost provider binding lives in
  # blueprints/grizzly-webmail.yaml, which enumerates every proxy provider (a
  # blueprint replaces the M2M list wholesale, so only one file may own it).
  # Do not add an outpost entry here.
