version: 1
metadata:
  name: home-iot
entries:
  # Authentik gates for the home IoT stack in lab-apps (apps/home-automation).
  # Both apps control physical devices in the house, so both are grizzly-admins
  # only. One file for the pair because they are one stack and share a rule.
  #
  # Home Assistant signs in over OIDC (the hass-oidc-auth custom integration),
  # NOT forward-auth: a proxy gate breaks the companion app, whose websocket and
  # webhook calls carry no Authentik session. The application binding below is
  # the real control — a non-admin is refused before any token is issued. HA
  # re-checks the `groups` claim (auth_oidc roles) as a second layer, and keeps
  # its local login as break-glass.
  #
  # Public client + PKCE, as the integration recommends, so there is no secret:
  # the client_id is not sensitive and lives here in git, matched by the
  # auth_oidc block in lab-apps.
  - model: authentik_providers_oauth2.oauth2provider
    id: home-assistant-provider
    identifiers:
      name: home-assistant
    attrs:
      client_type: public
      client_id: home-assistant
      # Authentik 2026.x needs grant types explicit, or every code request is
      # rejected as invalid_request.
      grant_types:
        - authorization_code
        - refresh_token
      # The companion app also lands here: it signs in via the integration's
      # device-code page in the phone browser, not an app-specific redirect.
      redirect_uris:
        - matching_mode: strict
          url: https://home.grizzly-endeavors.com/auth/oidc/callback
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # `profile` carries the `groups` claim that HA's role check reads.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Zigbee2MQTT's frontend has no login of its own and no app, so a forward-auth
  # gate is the right fit there — and its only protection.
  - model: authentik_providers_proxy.proxyprovider
    id: zigbee2mqtt-provider
    identifiers:
      name: zigbee2mqtt
    attrs:
      mode: forward_single
      external_host: https://zigbee.grizzly-endeavors.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: home-assistant-app
    identifiers:
      slug: home-assistant
    attrs:
      name: Home Assistant
      provider: !KeyOf home-assistant-provider
      meta_launch_url: https://home.grizzly-endeavors.com
      meta_description: "Lights and home automation (grizzly-admins only)"
      policy_engine_mode: any

  - model: authentik_core.application
    id: zigbee2mqtt-app
    identifiers:
      slug: zigbee2mqtt
    attrs:
      name: Zigbee2MQTT
      provider: !KeyOf zigbee2mqtt-provider
      meta_launch_url: https://zigbee.grizzly-endeavors.com
      meta_description: "Zigbee network: pairing, device settings, OTA (grizzly-admins only)"
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf home-assistant-app
      group: !Find [authentik_core.group, [name, grizzly-admins]]
      order: 0
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf zigbee2mqtt-app
      group: !Find [authentik_core.group, [name, grizzly-admins]]
      order: 0
    attrs:
      enabled: true
      negate: false

  # NOTE: the embedded-outpost provider binding lives in
  # blueprints/grizzly-webmail.yaml, which enumerates every proxy provider
  # (zigbee2mqtt only — home-assistant is OIDC, not a proxy provider).
  # Do not add an outpost entry here.
