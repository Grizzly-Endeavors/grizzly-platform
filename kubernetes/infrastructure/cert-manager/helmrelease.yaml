apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.4"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  targetNamespace: cert-manager
  install:
    createNamespace: false
  values:
    # CRDs ship with the chart. crds.keep adds helm.sh/resource-policy: keep
    # so uninstalling the release does not delete the CRDs (and with them
    # every Certificate and Issuer).
    crds:
      enabled: true
      keep: true
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    prometheus:
      enabled: true
      # R730xd Prometheus scrapes externally via NodePort (see metrics-service.yaml).
      # ServiceMonitor/PodMonitor would require an in-cluster Prometheus operator.
      servicemonitor:
        enabled: false
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    cainjector:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
