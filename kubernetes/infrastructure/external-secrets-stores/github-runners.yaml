# ExternalSecret manifests for arc-runners:
#   - sccache-s3-credentials (s3-bulk creds for Rust build cache)
#   - github-runner-pat (org-level PAT for ARC v2)
# Both previously seeded imperatively by seed-app-secrets.yml /
# setup-k8s-cicd.yml; now reconciled from 1Password via ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sccache-s3-credentials
  namespace: arc-runners
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sccache-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: cicd-sccache-s3/access_key
    - secretKey: secretkey
      remoteRef:
        key: cicd-sccache-s3/secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-runner-pat
  namespace: arc-runners
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-runner-pat
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: platform-github-runner/pat
