# ClusterSecretStore backed by 1Password. ExternalSecret manifests reference
# `spec.secretStoreRef = {kind: ClusterSecretStore, name: onepassword}`.
#
# Auth: a read-only 1Password service account token, materialised into the
# onepassword-token Secret by ansible/playbooks/setup-1password-eso.yml. This
# is the one credential that cannot come from an ExternalSecret — it is what
# makes ExternalSecrets work.
#
# A store is scoped to exactly one vault, which is what stops a single
# ExternalSecret from reaching every vault on the account.
#
# Naming convention: an item per domain, `<domain>-<name>`, with field labels
# unchanged. The field is part of the key, not a separate property — so
# `remoteRef.key: stores-postgres/password`.
#
# Caching is on because 1Password meters requests per account per day across
# every service account, and several ExternalSecrets read the same item —
# platform-authentik alone backs fourteen keys.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  # Re-validate against 1Password once a day. Validation calls the provider,
  # so this is what makes the store's Ready condition a liveness signal for
  # the service account token — without it the store is validated only when
  # its spec changes, and an expired or revoked token would go unnoticed
  # indefinitely.
  #
  # Daily rather than hourly because the failure is deferred: a dead token
  # does not disturb running workloads, it breaks the next rotation. Detecting
  # that within a day is as actionable as detecting it within an hour, and
  # ExternalSecrets sync OnChange precisely to keep steady-state provider
  # traffic near zero — the per-account cap is 1000 requests/day shared with
  # Ansible, so this spends 1 of them instead of 24.
  refreshInterval: 24h
  provider:
    onepasswordSDK:
      vault: grizzly-platform
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          namespace: external-secrets
          key: token
      cache:
        ttl: 1h
        maxSize: 100
