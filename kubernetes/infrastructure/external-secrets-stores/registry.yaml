apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-s3-creds
  namespace: registry
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: registry-s3-creds
    creationPolicy: Owner
  # Scoped s3-bulk versitygw account (ADR-055) that owns only the lab-registry
  # bucket. Provisioned by setup-registry-stores.yml.
  data:
    - secretKey: accessKey
      remoteRef:
        key: stores-registry/access_key
    - secretKey: secretKey
      remoteRef:
        key: stores-registry/secret_key
