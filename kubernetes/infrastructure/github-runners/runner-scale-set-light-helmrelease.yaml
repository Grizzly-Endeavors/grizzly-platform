# Light CI pool for jobs that only run a shell script or the GitHub CLI:
# deciding whether to run other jobs, reading a tag, creating a release.
# Jobs opt in with `runs-on: lab-runners-light`. Small requests let these jobs
# start without reserving the cores a build needs. There is no dind sidecar, so
# a job here cannot run Docker. See ADR-081.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-light
  namespace: flux-system
spec:
  interval: 30m
  dependsOn:
    - name: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
  targetNamespace: arc-runners
  install:
    createNamespace: false
  values:
    githubConfigUrl: "https://github.com/grizzly-endeavors"
    githubConfigSecret: github-runner-pat
    runnerScaleSetName: "lab-runners-light"
    minRunners: 0
    maxRunners: 6
    listenerMetrics:
      counters:
        gha_started_jobs_total:
          labels: ["repository", "organization", "job_name", "event_name"]
        gha_completed_jobs_total:
          labels: ["repository", "organization", "job_name", "event_name", "job_result"]
      gauges:
        gha_assigned_jobs:
          labels: ["name", "namespace", "repository", "organization"]
        gha_running_jobs:
          labels: ["name", "namespace", "repository", "organization"]
        gha_idle_runners:
          labels: ["name", "namespace", "repository", "organization"]
        gha_min_runners:
          labels: ["name", "namespace"]
        gha_max_runners:
          labels: ["name", "namespace"]
        gha_desired_runners:
          labels: ["name", "namespace"]
    template:
      spec:
        containers:
          - name: runner
            image: registry.registry.svc.cluster.local:5000/github-runner:latest
            imagePullPolicy: Always
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 2Gi
