# Syncs Langfuse's runtime credentials from 1Password into the langfuse
# namespace. One Secret, referenced by the HelmRelease through the chart's
# various `existingSecret` hooks and by additionalEnv for the OIDC pair.
#
#   db_password / clickhouse_password / s3_*  <- stores-langfuse
#       (provisioned by ansible/playbooks/setup-langfuse-stores.yml)
#   redis password                            <- stores-kv-cache
#       (the one shared kv-cache requirepass; there are no per-app ACL users)
#   salt / encryption_key / nextauth_secret   <- platform-langfuse
#       (app-level crypto material, not store credentials)
#   oidc_langfuse_client_*                    <- platform-authentik
#       (read cross-domain; the same two keys feed authentik's own
#        ExternalSecret so both sides of the OIDC contract agree)
#
# Placed with the workload rather than in external-secrets-stores/ so it is
# applied by the langfuse Flux Kustomization itself — the ClusterSecretStore
# already exists (that Kustomization is a dependsOn). Same placement as
# roundcube and stalwart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: stores-langfuse/db_password
    - secretKey: clickhouse-password
      remoteRef:
        key: stores-langfuse/clickhouse_password
    - secretKey: s3-access-key
      remoteRef:
        key: stores-langfuse/s3_access_key
    - secretKey: s3-secret-key
      remoteRef:
        key: stores-langfuse/s3_secret_key
    - secretKey: redis-password
      remoteRef:
        key: stores-kv-cache/password
    - secretKey: salt
      remoteRef:
        key: platform-langfuse/salt
    - secretKey: encryption-key
      remoteRef:
        key: platform-langfuse/encryption_key
    - secretKey: nextauth-secret
      remoteRef:
        key: platform-langfuse/nextauth_secret
    - secretKey: oidc-client-id
      remoteRef:
        key: platform-authentik/oidc_langfuse_client_id
    - secretKey: oidc-client-secret
      remoteRef:
        key: platform-authentik/oidc_langfuse_client_secret
