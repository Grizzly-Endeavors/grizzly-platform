# Syncs Metabase's runtime credentials from 1Password into the metabase
# namespace. Two values, both consumed as container env:
#
#   db_password    <- stores-metabase   (the `metabase` role owning Metabase's
#                     own database, provisioned by setup-metabase-stores.yml)
#   encryption_key <- platform-metabase (AES256 key for data source credentials
#                     stored inside that database)
#
# The `metabase_ro` passwords are deliberately NOT here. Those are data source
# credentials: they are entered through Metabase's API/UI and live encrypted in
# Metabase's own database, so putting them in the namespace as well would widen
# their exposure for nothing. The seeding script reads them straight from
# 1Password — see docs/integration/metabase.md.
#
# Placed with the workload rather than in external-secrets-stores/ so it is
# applied by the metabase Flux Kustomization itself — the ClusterSecretStore
# already exists (that Kustomization is a dependsOn). Same placement as
# langfuse, roundcube and stalwart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase-secrets
  namespace: metabase
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: metabase-secrets
    creationPolicy: Owner
  data:
    - secretKey: MB_DB_PASS
      remoteRef:
        key: stores-metabase/db_password
    - secretKey: MB_ENCRYPTION_SECRET_KEY
      remoteRef:
        key: platform-metabase/encryption_key
