# Roundcube webmail — the browser inbox for the self-hosted Stalwart mail server
# (ADR-056). Stalwart 0.16 ships no mailbox UI (only the admin console), so this
# is how mail is read/sent in a browser. Stateless PHP front-end: all durable
# state is on foundation Postgres, so the pod reschedules freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  namespace: roundcube
  labels:
    app.kubernetes.io/name: roundcube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: roundcube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roundcube
    spec:
      containers:
        - name: roundcube
          # Apache variant = self-contained web server on :80. Pinned by
          # digest: upstream rebuilds the same tag in place for PHP security
          # releases, so the tag alone doesn't say which PHP is running.
          image: roundcube/roundcubemail:1.7.5-apache@sha256:dfe7e05eccab55cf3d0d508fade5046ca4c7cd1530070c803d670ec2b2933607
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: roundcube-config
            - secretRef:
                name: roundcube-secrets
          volumeMounts:
            - name: php-overrides
              mountPath: /usr/local/etc/php/conf.d/zz-session-upload-progress.ini
              subPath: zz-session-upload-progress.ini
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: php-overrides
          configMap:
            name: roundcube-php
